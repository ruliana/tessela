name: Tag release

# Tags main with v<version> when the version in editor/package.json has no tag yet, then
# builds and publishes the release. A release is therefore just a merged "Release X.Y.Z"
# PR: nobody has to push the tag by hand (pushing a `v*` tag yourself still works and
# starts release-cli.yml and release-editor.yml directly).
#
# A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the release
# workflows are called from here instead of waiting for the tag push.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag if it does not exist
        id: tag
        run: |
          editor="$(node -p "require('./editor/package.json').version")"
          cli="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ "$editor" != "$cli" ]; then
            echo "editor/package.json says $editor but Cargo.toml says ${cli:-nothing}" >&2
            exit 1
          fi
          tag="v$editor"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  cli:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-cli.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  editor:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-editor.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
