name: Fuzz

# The property tests and the fuzz test of the command line run in CI on every pull request with
# a fixed seed and a few hundred cases. This workflow runs the same tests every night with many
# more cases and a new seed each time, to look where the fixed one does not.
#
# A failure prints the seed and the smallest failing case. To replay it on your machine:
#   TESSELA_FUZZ_SEED=<seed> TESSELA_FUZZ_CASES=<cases> cargo test --workspace
#   TESSELA_FUZZ_SEED=<seed> TESSELA_FUZZ_CASES=<cases> npm test   (in editor/)
# Run it by hand from the Actions tab to choose the number of cases and the seed.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        default: "5000"
      seed:
        description: Seed (the run number when empty)

env:
  TESSELA_FUZZ_CASES: ${{ inputs.cases || '5000' }}
  TESSELA_FUZZ_SEED: ${{ inputs.seed || github.run_id }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: echo "seed ${TESSELA_FUZZ_SEED}, ${TESSELA_FUZZ_CASES} cases"
      - run: cargo test --workspace --test 'props_*' --test fuzz

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: echo "seed ${TESSELA_FUZZ_SEED}, ${TESSELA_FUZZ_CASES} cases"
      - run: npx vitest run test/props
