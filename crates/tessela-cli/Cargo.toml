[package]
name = "tessela-cli"
description = "The tessela command line tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tessela"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
notify = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tessela-core = { path = "../tessela-core" }
walkdir = "2.5.0"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
